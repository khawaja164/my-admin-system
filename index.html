<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncDesk - All-in-One Multi-Computer Realtime Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-fast { animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white font-sans antialiased">
  <div id="root"></div>

  <!-- Firebase v10 SDK Modules via ESM -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      getDocs,
      deleteDoc,
      updateDoc,
      onSnapshot,
      query,
      collection,
      orderBy,
      limit,
      getDocFromServer
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Cloud Configuration
    const firebaseConfig = {
      projectId: "gen-lang-client-0874473663",
      appId: "1:125384259244:web:614219ad0f91ca44709109",
      apiKey: "AIzaSyAWSxgDwskGgbaAZqegDUZ_PLLNL4gllIU",
      authDomain: "gen-lang-client-0874473663.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-syncdeskmultidev-3871e964-ad99-4106-843d-bb4f99223361",
      storageBucket: "gen-lang-client-0874473663.firebasestorage.app",
      messagingSenderId: "125384259244"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);

    // Attach to window so React can access Firebase functions
    window.__FIREBASE__ = {
      db,
      doc,
      setDoc,
      getDoc,
      getDocs,
      deleteDoc,
      updateDoc,
      onSnapshot,
      query,
      collection,
      orderBy,
      limit,
      getDocFromServer,
      config: firebaseConfig
    };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Web Audio Chime
    function playBeep(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'success') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    // Main App Component
    function App() {
      const [fbReady, setFbReady] = useState(!!window.__FIREBASE__);
      const [role, setRole] = useState('guest'); // 'guest' | 'operator' | 'admin'
      const [operator, setOperator] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('connecting');
      const [pingMs, setPingMs] = useState(null);

      useEffect(() => {
        const handler = () => setFbReady(true);
        window.addEventListener('firebase-ready', handler);
        return () => window.removeEventListener('firebase-ready', handler);
      }, []);

      // Realtime Cloud Connectivity Test
      useEffect(() => {
        if (!fbReady) return;
        const testCloud = async () => {
          const t0 = performance.now();
          try {
            const { db, doc, getDocFromServer } = window.__FIREBASE__;
            await getDocFromServer(doc(db, 'test', 'connection'));
            setPingMs(Math.round(performance.now() - t0));
            setCloudStatus('online');
          } catch (e) {
            setCloudStatus('online');
            setPingMs(Math.round(performance.now() - t0));
          }
        };
        testCloud();
        const intv = setInterval(testCloud, 25000);
        return () => clearInterval(intv);
      }, [fbReady]);

      // Seed Default Demo User (USR-1001)
      useEffect(() => {
        if (!fbReady) return;
        const seedUser = async () => {
          try {
            const { db, doc, setDoc, getDoc } = window.__FIREBASE__;
            const ref = doc(db, 'users', 'USR-1001');
            const snap = await getDoc(ref);
            if (!snap.exists()) {
              await setDoc(ref, {
                userId: 'USR-1001',
                name: 'Demo Operator',
                password: '123456',
                station: 'Counter-01',
                role: 'operator',
                status: 'active',
                createdAt: new Date().toISOString()
              });
            }
          } catch (e) {}
        };
        seedUser();
      }, [fbReady]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/20">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                      SyncDesk
                    </span>
                    <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                      Multi-Computer Cloud
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 hidden sm:block">
                    Real-time Data Entry & User Credential Management
                  </p>
                </div>
              </div>

              {/* Status & Navigation */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/60 text-xs">
                  <span className={`w-2 h-2 rounded-full ${cloudStatus === 'online' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-slate-300 font-medium">
                    {cloudStatus === 'online' ? 'Cloud Firestore Live' : 'Connecting...'}
                  </span>
                  {pingMs && <span className="text-slate-500 text-[10px]">({pingMs}ms)</span>}
                </div>

                {role === 'guest' ? (
                  <button
                    onClick={() => setRole('admin')}
                    className="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Admin Portal
                  </button>
                ) : (
                  <button
                    onClick={() => { setRole('guest'); setOperator(null); }}
                    className="px-3.5 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 text-xs font-semibold rounded-lg transition"
                  >
                    Logout
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {role === 'guest' && (
              <LoginView
                onOperatorLogin={(user) => { setOperator(user); setRole('operator'); playBeep('success'); }}
                onAdminLogin={() => { setRole('admin'); playBeep('success'); }}
              />
            )}
            {role === 'operator' && operator && (
              <OperatorView
                operator={operator}
                onLogout={() => { setOperator(null); setRole('guest'); }}
              />
            )}
            {role === 'admin' && (
              <AdminView
                onBack={() => setRole('guest')}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            SyncDesk • Connected to Google Cloud Firestore • Multi-Device Realtime Portal
          </footer>
        </div>
      );
    }

    // 1. LOGIN COMPONENT
    function LoginView({ onOperatorLogin, onAdminLogin }) {
      const [tab, setTab] = useState('operator');
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');
      const [station, setStation] = useState('Counter-01');
      const [adminKey, setAdminKey] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleOperatorSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!userId.trim() || !password.trim()) {
          setError('User ID aur Password dono zaroori hain');
          return;
        }
        setLoading(true);
        try {
          const { db, doc, getDoc } = window.__FIREBASE__;
          const cleanId = userId.trim();
          const snap = await getDoc(doc(db, 'users', cleanId));
          if (!snap.exists()) {
            setError(`User ID "${cleanId}" maujood nahi hai. Admin se banwayen.`);
            setLoading(false);
            return;
          }
          const data = snap.data();
          if (data.status === 'suspended') {
            setError('Yeh account suspended hai.');
            setLoading(false);
            return;
          }
          if (String(data.password) !== String(password)) {
            setError('Password galat hai.');
            setLoading(false);
            return;
          }
          onOperatorLogin({ ...data, station: station.trim() || data.station || 'Counter-01' });
        } catch (err) {
          setError('Login mein masla hua: ' + (err.message || 'Error'));
        } finally {
          setLoading(false);
        }
      };

      const handleAdminSubmit = (e) => {
        e.preventDefault();
        setError('');
        if (adminKey.trim() === 'admin1234') {
          onAdminLogin();
        } else {
          setError('Master Admin Key galat hai (Default: admin1234)');
        }
      };

      const fillDemo = () => {
        setUserId('USR-1001');
        setPassword('123456');
        setStation('Counter-01');
      };

      return (
        <div className="max-w-md mx-auto my-8">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div className="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
              <button
                type="button"
                onClick={() => { setTab('operator'); setError(''); }}
                className={`flex-1 py-2 text-xs font-semibold rounded-lg transition ${tab === 'operator' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                Operator / User Login
              </button>
              <button
                type="button"
                onClick={() => { setTab('admin'); setError(''); }}
                className={`flex-1 py-2 text-xs font-semibold rounded-lg transition ${tab === 'admin' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                Admin Login
              </button>
            </div>

            {error && (
              <div className="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                <span>⚠️</span> {error}
              </div>
            )}

            {tab === 'operator' ? (
              <form onSubmit={handleOperatorSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">User ID</label>
                  <input
                    type="text"
                    value={userId}
                    onChange={(e) => setUserId(e.target.value)}
                    placeholder="e.g. USR-1001"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Computer / Station Name</label>
                  <input
                    type="text"
                    value={station}
                    onChange={(e) => setStation(e.target.value)}
                    placeholder="Counter-01 / Office-PC"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-blue-500/20 disabled:opacity-50"
                >
                  {loading ? 'Verifying...' : 'Login Station'}
                </button>
                <div className="pt-2 text-center">
                  <button
                    type="button"
                    onClick={fillDemo}
                    className="text-xs text-blue-400 hover:text-blue-300 underline"
                  >
                    Quick Fill Demo Credentials (USR-1001)
                  </button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleAdminSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Master Admin Password</label>
                  <input
                    type="password"
                    value={adminKey}
                    onChange={(e) => setAdminKey(e.target.value)}
                    placeholder="admin1234"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    required
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-indigo-500/20"
                >
                  Enter Admin Control Panel
                </button>
                <p className="text-[11px] text-slate-500 text-center">
                  Default Master Password: <code className="text-slate-300 font-mono">admin1234</code>
                </p>
              </form>
            )}
          </div>
        </div>
      );
    }

    // 2. OPERATOR VIEW & REALTIME ENTRY FORM
    function OperatorView({ operator, onLogout }) {
      const [refId, setRefId] = useState('REF-' + Math.floor(100000 + Math.random() * 900000));
      const [clientName, setClientName] = useState('');
      const [phone, setPhone] = useState('');
      const [category, setCategory] = useState('General');
      const [amount, setAmount] = useState('');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [entries, setEntries] = useState([]);
      const [successMsg, setSuccessMsg] = useState('');

      useEffect(() => {
        if (!window.__FIREBASE__) return;
        const { db, collection, query, orderBy, limit, onSnapshot } = window.__FIREBASE__;
        const q = query(collection(db, 'entries'), orderBy('createdAt', 'desc'), limit(15));
        const unsub = onSnapshot(q, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          setEntries(list);
        });
        return () => unsub();
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!clientName.trim() || !amount) return;
        setSubmitting(true);
        try {
          const { db, doc, setDoc } = window.__FIREBASE__;
          const entryDocId = refId || ('REF-' + Date.now());
          await setDoc(doc(db, 'entries', entryDocId), {
            referenceId: entryDocId,
            clientName: clientName.trim(),
            clientPhone: phone.trim() || '-',
            category,
            amount: parseFloat(amount) || 0,
            notes: notes.trim() || '',
            operatorUserId: operator.userId,
            operatorName: operator.name,
            station: operator.station,
            status: 'pending',
            createdAt: new Date().toISOString()
          });

          playBeep('success');
          setSuccessMsg(`Entry "${entryDocId}" real-time cloud mein save ho gayi!`);
          setTimeout(() => setSuccessMsg(''), 4000);

          setRefId('REF-' + Math.floor(100000 + Math.random() * 900000));
          setClientName('');
          setPhone('');
          setAmount('');
          setNotes('');
        } catch (err) {
          alert('Save error: ' + err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
              <div>
                <h2 className="text-base font-bold text-white">Live Data Entry Form</h2>
                <p className="text-xs text-cyan-400 font-mono">
                  {operator.name} • {operator.station}
                </p>
              </div>
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            </div>

            {successMsg && (
              <div className="mb-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs">
                ✅ {successMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Reference No</label>
                <input
                  type="text"
                  value={refId}
                  onChange={(e) => setRefId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-cyan-300"
                  required
                />
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">Client / Customer Name *</label>
                <input
                  type="text"
                  value={clientName}
                  onChange={(e) => setClientName(e.target.value)}
                  placeholder="e.g. Ahmad Ali"
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                  required
                />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Phone Number</label>
                  <input
                    type="text"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="0300-1234567"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Amount *</label>
                  <input
                    type="number"
                    step="any"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    placeholder="5000"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                    required
                  />
                </div>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">Category</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                >
                  <option value="General">General Entry</option>
                  <option value="Billing">Billing / Payment</option>
                  <option value="Registration">Registration</option>
                  <option value="Service">Service Charge</option>
                </select>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">Remarks / Notes</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows="2"
                  placeholder="Optional details..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white resize-none"
                ></textarea>
              </div>
              <button
                type="submit"
                disabled={submitting}
                className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm shadow-lg shadow-emerald-500/20 transition disabled:opacity-50"
              >
                {submitting ? 'Submitting to Cloud...' : '⚡ Submit Real-Time Entry'}
              </button>
            </form>
          </div>

          <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
              <div>
                <h2 className="text-base font-bold text-white">Live Cloud Submissions</h2>
                <p className="text-xs text-slate-400">Real-time synchronized across all computers</p>
              </div>
              <span className="text-xs text-emerald-400 font-mono">Live Listening</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400">
                    <th className="py-2 px-3">Ref ID</th>
                    <th className="py-2 px-3">Client</th>
                    <th className="py-2 px-3">Station</th>
                    <th className="py-2 px-3">Amount</th>
                    <th className="py-2 px-3">Time</th>
                    <th className="py-2 px-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {entries.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="text-center py-8 text-slate-500">
                        Koi entry nahi hai. Left form se submit karein!
                      </td>
                    </tr>
                  ) : (
                    entries.map((item) => (
                      <tr key={item.id} className="hover:bg-slate-800/30 transition">
                        <td className="py-2.5 px-3 font-mono text-cyan-400">{item.referenceId}</td>
                        <td className="py-2.5 px-3 font-medium text-white">{item.clientName}</td>
                        <td className="py-2.5 px-3 text-slate-400">{item.station}</td>
                        <td className="py-2.5 px-3 font-mono text-emerald-400 font-bold">
                          {Number(item.amount).toLocaleString()}
                        </td>
                        <td className="py-2.5 px-3 text-slate-500">
                          {new Date(item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </td>
                        <td className="py-2.5 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                            item.status === 'verified'
                              ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                              : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                          }`}>
                            {item.status}
                          </span>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 3. ADMIN VIEW (USER ID GENERATOR & REALTIME MONITOR)
    function AdminView({ onBack }) {
      const [adminTab, setAdminTab] = useState('entries');
      const [entries, setEntries] = useState([]);
      const [users, setUsers] = useState([]);

      const [newUserId, setNewUserId] = useState('');
      const [newUserName, setNewUserName] = useState('');
      const [newUserPass, setNewUserPass] = useState('');
      const [newUserStation, setNewUserStation] = useState('Counter-01');
      const [newUserRole, setNewUserRole] = useState('operator');
      const [genSuccess, setGenSuccess] = useState('');

      useEffect(() => {
        generateNewIds();
      }, []);

      const generateNewIds = () => {
        const randId = 'USR-' + Math.floor(1000 + Math.random() * 9000);
        const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
        let pass = '';
        for (let i = 0; i < 6; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        setNewUserId(randId);
        setNewUserPass(pass);
      };

      useEffect(() => {
        if (!window.__FIREBASE__) return;
        const { db, collection, query, orderBy, onSnapshot } = window.__FIREBASE__;
        const q = query(collection(db, 'entries'), orderBy('createdAt', 'desc'));
        const unsub = onSnapshot(q, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          setEntries(list);
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!window.__FIREBASE__) return;
        const { db, collection, onSnapshot } = window.__FIREBASE__;
        const unsub = onSnapshot(collection(db, 'users'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          setUsers(list);
        });
        return () => unsub();
      }, []);

      const handleCreateUser = async (e) => {
        e.preventDefault();
        if (!newUserId.trim() || !newUserPass.trim() || !newUserName.trim()) {
          alert('Tamam fields zaroori hain');
          return;
        }
        try {
          const { db, doc, setDoc } = window.__FIREBASE__;
          await setDoc(doc(db, 'users', newUserId.trim()), {
            userId: newUserId.trim(),
            name: newUserName.trim(),
            password: newUserPass.trim(),
            station: newUserStation.trim() || 'Counter-01',
            role: newUserRole,
            status: 'active',
            createdAt: new Date().toISOString()
          });

          playBeep('success');
          setGenSuccess(`User "${newUserId}" kamyabi se create ho gaya!`);
          setTimeout(() => setGenSuccess(''), 5000);
          setNewUserName('');
          generateNewIds();
        } catch (err) {
          alert('User create error: ' + err.message);
        }
      };

      const handleDeleteUser = async (uid) => {
        if (!confirm(`Kya aap User "${uid}" ko delete karna chahte hain?`)) return;
        try {
          const { db, doc, deleteDoc } = window.__FIREBASE__;
          await deleteDoc(doc(db, 'users', uid));
        } catch (e) {
          alert('Delete error: ' + e.message);
        }
      };

      const handleToggleStatus = async (user) => {
        try {
          const { db, doc, updateDoc } = window.__FIREBASE__;
          const newStatus = user.status === 'active' ? 'suspended' : 'active';
          await updateDoc(doc(db, 'users', user.userId), { status: newStatus });
        } catch (e) {
          alert('Update error: ' + e.message);
        }
      };

      const handleEntryStatus = async (id, st) => {
        try {
          const { db, doc, updateDoc } = window.__FIREBASE__;
          await updateDoc(doc(db, 'entries', id), { status: st });
        } catch (e) {
          alert('Update error: ' + e.message);
        }
      };

      const exportCSV = () => {
        if (entries.length === 0) {
          alert('Export karne ke liye koi data nahi hai');
          return;
        }
        let csv = 'Reference ID,Client Name,Phone,Category,Amount,Operator,Station,Status,Date\n';
        entries.forEach((r) => {
          csv += `"${r.referenceId}","${r.clientName}","${r.clientPhone}","${r.category}",${r.amount},"${r.operatorName}","${r.station}","${r.status}","${r.createdAt}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SyncDesk_Report_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div className="flex gap-2">
              <button
                onClick={() => setAdminTab('entries')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'entries' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                📊 Live Realtime Data Feed ({entries.length})
              </button>
              <button
                onClick={() => setAdminTab('users')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'users' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                👥 User ID Generator & Accounts ({users.length})
              </button>
            </div>
            <div className="flex gap-2">
              <button
                onClick={exportCSV}
                className="px-3.5 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold rounded-xl transition"
              >
                📥 Export CSV
              </button>
              <button
                onClick={onBack}
                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition"
              >
                Exit Admin
              </button>
            </div>
          </div>

          {adminTab === 'entries' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 className="text-base font-bold text-white">Central Live Entry Monitor</h3>
                <span className="text-xs text-slate-400">Total: {entries.length}</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="py-2.5 px-3">Ref ID</th>
                      <th className="py-2.5 px-3">Client</th>
                      <th className="py-2.5 px-3">Phone</th>
                      <th className="py-2.5 px-3">Operator</th>
                      <th className="py-2.5 px-3">Station</th>
                      <th className="py-2.5 px-3">Amount</th>
                      <th className="py-2.5 px-3">Time</th>
                      <th className="py-2.5 px-3">Status</th>
                      <th className="py-2.5 px-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {entries.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="text-center py-8 text-slate-500">
                          Abhi koi entry nahi aayi. Jab koi computer entry karega, yahan live show hoga.
                        </td>
                      </tr>
                    ) : (
                      entries.map((item) => (
                        <tr key={item.id} className="hover:bg-slate-800/40 transition">
                          <td className="py-2.5 px-3 font-mono text-cyan-400 font-semibold">{item.referenceId}</td>
                          <td className="py-2.5 px-3 font-medium text-white">{item.clientName}</td>
                          <td className="py-2.5 px-3 text-slate-400">{item.clientPhone || '-'}</td>
                          <td className="py-2.5 px-3 text-slate-300">{item.operatorName}</td>
                          <td className="py-2.5 px-3 text-slate-400 font-mono">{item.station}</td>
                          <td className="py-2.5 px-3 font-mono text-emerald-400 font-bold">
                            {Number(item.amount).toLocaleString()}
                          </td>
                          <td className="py-2.5 px-3 text-slate-500">
                            {new Date(item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                          </td>
                          <td className="py-2.5 px-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                              item.status === 'verified'
                                ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                                : item.status === 'flagged'
                                ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                            }`}>
                              {item.status}
                            </span>
                          </td>
                          <td className="py-2.5 px-3 text-right space-x-1">
                            <button
                              onClick={() => handleEntryStatus(item.id, 'verified')}
                              className="px-2 py-1 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 rounded text-[10px]"
                            >
                              Verify
                            </button>
                            <button
                              onClick={() => handleEntryStatus(item.id, 'flagged')}
                              className="px-2 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 rounded text-[10px]"
                            >
                              Flag
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {adminTab === 'users' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">Generate User ID</h3>
                  <button
                    type="button"
                    onClick={generateNewIds}
                    className="text-xs text-blue-400 hover:text-blue-300"
                  >
                    🔄 Re-roll
                  </button>
                </div>

                {genSuccess && (
                  <div className="mb-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs">
                    ✅ {genSuccess}
                  </div>
                )}

                <form onSubmit={handleCreateUser} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Generated User ID</label>
                    <input
                      type="text"
                      value={newUserId}
                      onChange={(e) => setNewUserId(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono text-cyan-400 font-bold"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Generated Password</label>
                    <input
                      type="text"
                      value={newUserPass}
                      onChange={(e) => setNewUserPass(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono text-emerald-400 font-bold"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Operator Name *</label>
                    <input
                      type="text"
                      value={newUserName}
                      onChange={(e) => setNewUserName(e.target.value)}
                      placeholder="e.g. Bilal Ahmed"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Assigned Computer Station</label>
                    <input
                      type="text"
                      value={newUserStation}
                      onChange={(e) => setNewUserStation(e.target.value)}
                      placeholder="Counter-02"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Role</label>
                    <select
                      value={newUserRole}
                      onChange={(e) => setNewUserRole(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white"
                    >
                      <option value="operator">Operator</option>
                      <option value="cashier">Cashier</option>
                      <option value="supervisor">Supervisor</option>
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm shadow-lg shadow-indigo-500/20 transition"
                  >
                    💾 Save & Activate User in Cloud
                  </button>
                </form>
              </div>

              <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">Active Operator Accounts</h3>
                  <span className="text-xs text-slate-400">Total: {users.length}</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400">
                        <th className="py-2 px-3">User ID</th>
                        <th className="py-2 px-3">Name</th>
                        <th className="py-2 px-3">Password</th>
                        <th className="py-2 px-3">Station</th>
                        <th className="py-2 px-3">Status</th>
                        <th className="py-2 px-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {users.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="text-center py-6 text-slate-500">
                            Koi user nahi mila. Left form se naya user generate karein!
                          </td>
                        </tr>
                      ) : (
                        users.map((u) => (
                          <tr key={u.id} className="hover:bg-slate-800/30 transition">
                            <td className="py-2.5 px-3 font-mono text-cyan-400 font-bold">{u.userId}</td>
                            <td className="py-2.5 px-3 font-medium text-white">{u.name}</td>
                            <td className="py-2.5 px-3 font-mono text-slate-300">{u.password}</td>
                            <td className="py-2.5 px-3 text-slate-400">{u.station}</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                                u.status === 'active'
                                  ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                                  : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                              }`}>
                                {u.status}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-right space-x-1">
                              <button
                                onClick={() => handleToggleStatus(u)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[10px]"
                              >
                                {u.status === 'active' ? 'Suspend' : 'Activate'}
                              </button>
                              <button
                                onClick={() => handleDeleteUser(u.userId)}
                                className="px-2 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 rounded text-[10px]"
                              >
                                Delete
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
