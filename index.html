<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HUMA CLINIC - OPD SYSTEM (Fixed)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui;background:#f0fdfa}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full">
<h1 class="text-2xl font-bold text-teal-700 text-center">HUMA CLINIC</h1>
<p class="text-center text-gray-500 mb-6">OPD Management System</p>
<div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
<p class="text-green-800 text-sm"><b>✓ Fix:</b> aistudio-iframe.js deleted</p>
<p class="text-green-700 text-xs mt-1">Ab Vercel + Multiple mobiles par chalega</p>
</div>
<div class="space-y-3">
<label class="block text-sm">Username<input id="u" class="w-full border rounded px-3 py-2 mt-1" value="admin"></label>
<label class="block text-sm">Password<input id="p" type="password" class="w-full border rounded px-3 py-2 mt-1" value="admin123"></label>
<button onclick="login()" class="w-full bg-teal-600 text-white rounded py-2">Login</button>
</div>
<p id="msg" class="text-center text-sm mt-4"></p>
</div>
<script>
function login(){
 const u=document.getElementById('u').value;
 const p=document.getElementById('p').value;
 if(u==='admin' && p==='admin123'){
   document.getElementById('msg').innerHTML='<span style=color:green>Login OK - System Ready for Vercel</span>';
   localStorage.setItem('huma_login','1');
 } else {
   document.getElementById('msg').innerHTML='<span style=color:red>Invalid</span>';
 }
}
</script>
</body>
</html>
