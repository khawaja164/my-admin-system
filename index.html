<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Workspace</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17243b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{height:68px;background:#fff;border-bottom:1px solid #e3e9f2;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2))}.brand{font-weight:800;font-size:19px}.logo{display:inline-grid;place-items:center;background:#5667ee;color:#fff;border-radius:11px;width:34px;height:34px;margin-right:9px}.muted{color:#697891}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{margin:12px 0 24px}.hero h1{margin:5px 0;font-size:clamp(27px,4vw,36px);letter-spacing:-.04em}.eyebrow{color:#5667ee;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.panel,.stat,.login{background:#fff;border:1px solid #e3e9f2;border-radius:16px;padding:20px;box-shadow:0 10px 28px #1826460d}.login{width:min(440px,100%);margin:7vh auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.stat small{color:#697891;font-weight:700}.num{font-size:28px;font-weight:800;margin-top:8px}.panel{margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 5px}.desc{color:#697891;font-size:13px;margin:0 0 18px}.tabs{display:flex;gap:7px;margin-bottom:18px;background:#eaf0fa;padding:5px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 15px;border-radius:8px;color:#697891;font-weight:700;white-space:nowrap}.tabs button.active{background:white;color:#17243b}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#697891;font-weight:700}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dbe3f0;border-radius:9px;font:inherit;color:#17243b;background:#fff}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.btn{border:1px solid #dbe3f0;background:#fff;color:#17243b;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#5667ee;border-color:#5667ee;color:white}.danger{color:#bd3448}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{background:#f0f2ff;border:1px solid #dfe3ff;color:#414da7;border-radius:11px;padding:12px 14px;font-size:12px;margin-bottom:16px}.status{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.active{background:#e2f7ef;color:#16865f}.off{background:#ffeaed;color:#bd3448}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8edf5;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#697891}tr:last-child td{border-bottom:0}.hidden{display:none!important}.error{color:#bd3448;font-size:13px;margin-top:10px}.success{color:#16865f;font-size:13px;margin-top:10px}.topright{display:flex;align-items:center;gap:10px}.pill{font-size:12px;color:#697891}.empty{text-align:center;padding:25px;color:#697891}.small{font-size:11px;color:#697891;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:540px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:20px 12px}.panel{padding:15px}header{padding:0 12px}.tabs button{padding:9px 11px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">N</span>Northstar <span class="muted" style="font-weight:400">Workspace</span></div><div class="topright"><span id="who" class="pill"></span><button id="logout" class="btn hidden">Log out</button></div></header>
<main id="app"><div class="login"><div class="eyebrow">Secure workspace</div><h1 style="font-size:26px">Loading portal…</h1><p class="muted">Connecting to Firebase.</p></div></main>
<div id="toast" style="position:fixed;bottom:18px;right:18px;background:#17243b;color:white;padding:12px 16px;border-radius:10px;display:none;max-width:90vw"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, addDoc, setDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

// 1) Replace this object with your Firebase project's web app configuration.
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app);
const $ = (s) => document.querySelector(s);
let currentProfile = null, usersCache = [], entriesCache = [], activeTab = "overview";
let stopUsers = null, stopEntries = null;
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText = (v) => { const d = v?.toDate ? v.toDate() : (v ? new Date(v) : null); return d && !isNaN(d) ? d.toLocaleString() : "—"; };
const showToast = (s) => { const t=$("#toast"); t.textContent=s; t.style.display="block"; setTimeout(()=>t.style.display="none",2600); };
const safeError = (e) => {
  const code = e?.code || "";
  if (code.includes("auth/invalid-credential") || code.includes("auth/wrong-password") || code.includes("auth/user-not-found")) return "Login ID or password is incorrect.";
  if (code.includes("permission-denied")) return "Permission denied. Check your account role and Firestore rules.";
  return e?.message || "Something went wrong. Please try again.";
};
const aliasEmail = (loginId) => `${String(loginId).trim().toLowerCase()}@login.northstar.invalid`;
function stopListeners(){ if(stopUsers) stopUsers(); if(stopEntries) stopEntries(); stopUsers=stopEntries=null; }
function header(title, sub){return `<div class="hero"><div class="eyebrow">Workspace control center</div><h1>${title}</h1><p class="muted">${sub}</p></div>`;}
function setApp(html){$("#app").innerHTML=html;}
function renderLogin(error=""){
  $("#who").textContent=""; $("#logout").classList.add("hidden");
  setApp(`<section class="login"><div class="eyebrow">Secure workspace</div><h1 style="font-size:27px;margin:8px 0">Welcome back</h1><p class="muted">Sign in using your login ID and password.</p><form id="loginForm"><div class="field"><label>LOGIN ID</label><input name="loginId" autocomplete="username" required placeholder="Your login ID"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><div class="error">${esc(error)}</div><button class="btn primary" style="width:100%;margin-top:8px">Sign in</button></form><p class="small">Accounts are created by your administrator. Login IDs are converted to an internal Firebase sign-in alias; add real email support before enabling password resets.</p></section>`);
  $("#loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,aliasEmail(f.get("loginId")),String(f.get("password")));}catch(err){renderLogin(safeError(err));}};
}
function render(){
  stopListeners();
  if(!currentProfile){renderLogin();return;}
  $("#who").textContent=`${currentProfile.name} · ${currentProfile.role}`;
  $("#logout").classList.remove("hidden");
  if(currentProfile.role==="admin") renderAdmin(); else renderUser();
}
$("#logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth, async user=>{
  stopListeners();
  if(!user){currentProfile=null;renderLogin();return;}
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists() || snap.data().status!=="Active"){await signOut(auth);renderLogin("This account is not active. Contact your administrator.");return;}
    currentProfile={uid:user.uid,...snap.data()};
    listenData();
    render();
  }catch(e){currentProfile=null;renderLogin(safeError(e));}
});
function listenData(){
  stopListeners();
  stopUsers=onSnapshot(query(collection(db,"users"),orderBy("createdAt","desc")),s=>{usersCache=s.docs.map(d=>({uid:d.id,...d.data()}));if(currentProfile?.role==="admin")renderAdmin();},e=>showToast(safeError(e)));
  stopEntries=onSnapshot(query(collection(db,"entries"),orderBy("createdAt","desc")),s=>{entriesCache=s.docs.map(d=>({id:d.id,...d.data()}));if(currentProfile)currentProfile.role==="admin"?renderAdmin():renderUser();},e=>showToast(safeError(e)));
}
function renderAdmin(){
  const active=usersCache.filter(u=>u.status==="Active").length;
  const ownEntries=entriesCache.filter(e=>e.userId===currentProfile.uid);
  const recent=entriesCache.slice(0,5);
  setApp(`<div class="wrap">${header("Admin dashboard","Manage accounts and view user submissions across connected devices.")}<div class="notice"><b>Live Firebase mode:</b> user accounts and submissions are read from Cloud Firestore in real time. Protect your Firebase project and deploy the included security rules and Cloud Function.</div><nav class="tabs"><button data-tab="overview" class="${activeTab==="overview"?"active":""}">Overview</button><button data-tab="users" class="${activeTab==="users"?"active":""}">User accounts</button><button data-tab="entries" class="${activeTab==="entries"?"active":""}">Entry records</button></nav>${activeTab==="overview"?`<div class="grid"><div class="stat"><small>TOTAL USERS</small><div class="num">${usersCache.length}</div></div><div class="stat"><small>ACTIVE USERS</small><div class="num">${active}</div></div><div class="stat"><small>TOTAL ENTRIES</small><div class="num">${entriesCache.length}</div></div><div class="stat"><small>MY ENTRIES</small><div class="num">${ownEntries.length}</div></div></div><section class="panel"><h2>Recent submissions</h2><p class="desc">New entries appear automatically on this page.</p>${entryTable(recent)}</section><section class="panel"><h2>Quick actions</h2><div class="actions"><button class="btn primary" id="goCreate">＋ Create user</button><button class="btn" id="goEntries">View all entries</button></div></section>`:activeTab==="users"?usersView():entriesView()}</div>`);
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderAdmin();});
  const goCreate=$("#goCreate");if(goCreate)goCreate.onclick=()=>{activeTab="users";renderAdmin();};
  const goEntries=$("#goEntries");if(goEntries)goEntries.onclick=()=>{activeTab="entries";renderAdmin();};
  const form=$("#createUser");if(form)form.onsubmit=createUser;
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleUser(b.dataset.toggle));
  const search=$("#userSearch");if(search)search.oninput=()=>$("#userTable").innerHTML=userTable(usersCache.filter(u=>(u.name+" "+u.loginId+" "+u.userCode).toLowerCase().includes(search.value.toLowerCase())));
  const es=$("#entrySearch");if(es)es.oninput=()=>$("#entryTable").innerHTML=entryTable(entriesCache.filter(e=>(e.title+" "+e.userName+" "+e.category+" "+e.details+" "+e.userCode).toLowerCase().includes(es.value.toLowerCase())));
  const csv=$("#exportCsv");if(csv)csv.onclick=exportCsv;
}
function usersView(){return `<div class="two"><section class="panel"><h2>Create user account</h2><p class="desc">Generate a user ID and login credentials.</p><form id="createUser"><div class="fields"><div class="field full"><label>FULL NAME</label><input name="name" required maxlength="80" placeholder="e.g. Ali Raza"></div><div class="field"><label>LOGIN ID</label><input name="loginId" required pattern="[A-Za-z0-9._-]{3,30}" minlength="3" maxlength="30" placeholder="ali.raza"></div><div class="field"><label>TEMPORARY PASSWORD</label><input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div></div><button class="btn primary">Create account</button><div id="createMessage" class="small"></div></form><p class="small">Give credentials to the user securely. The password is managed by Firebase Authentication and is not stored in Firestore.</p></section><section class="panel"><h2>Account controls</h2><p class="desc">Disable an account to prevent further access.</p><p class="muted">Every account gets a generated ID. Users can only see their own submissions; admins can see all entries.</p></section></div><section class="panel"><h2>All users</h2><p class="desc">Live account list</p><input id="userSearch" placeholder="Search users…"><div id="userTable" style="margin-top:14px">${userTable(usersCache)}</div></section>`;}
function userTable(list){if(!list.length)return '<div class="empty">No users found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Login ID</th><th>User ID</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.loginId||"—")}</td><td>${esc(u.userCode||"—")}</td><td><span class="status ${u.status==="Active"?"active":"off"}">${esc(u.status)}</span></td><td>${u.role==="admin"?"Admin":`<button class="btn ${u.status==="Active"?"danger":""}" data-toggle="${esc(u.uid)}">${u.status==="Active"?"Disable":"Enable"}</button>`}</td></tr>`).join("")}</tbody></table></div>`;}
function entriesView(){return `<section class="panel"><h2>All entry records</h2><p class="desc">Every new submission is synchronized live.</p><div class="fields"><div class="field"><input id="entrySearch" placeholder="Search entries…"></div><div class="field"><button class="btn" id="exportCsv">Export CSV</button></div></div><div id="entryTable">${entryTable(entriesCache)}</div></section>`;}
function entryTable(list){if(!list.length)return '<div class="empty">No submissions yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Title / Record</th><th>Submitted by</th><th>Category</th><th>Details</th><th>Date</th></tr></thead><tbody>${list.map(e=>`<tr><td><b>${esc(e.title)}</b><div class="muted">${esc(e.id)}</div></td><td>${esc(e.userName)}<div class="muted">${esc(e.userCode)}</div></td><td>${esc(e.category)}</td><td style="white-space:normal;min-width:170px">${esc(e.details||"—")}</td><td>${dateText(e.createdAt)}</td></tr>`).join("")}</tbody></table></div>`;}
async function createUser(e){
  e.preventDefault();const form=e.currentTarget, f=new FormData(form), msg=$("#createMessage");
  msg.textContent="Creating account…";
  try{
    const create= httpsCallable(functions,"adminCreateUser");
    const result=await create({name:String(f.get("name")).trim(),loginId:String(f.get("loginId")).trim(),password:String(f.get("password"))});
    msg.textContent=`Created ${result.data.userCode} · Login ID: ${result.data.loginId}`;
    msg.className="success";form.reset();showToast("User account created");
  }catch(err){msg.textContent=safeError(err);msg.className="error";}
}
async function toggleUser(uid){
  const u=usersCache.find(x=>x.uid===uid);if(!u)return;
  try{await updateDoc(doc(db,"users",uid),{status:u.status==="Active"?"Disabled":"Active"});showToast("Account status updated");}
  catch(e){showToast(safeError(e));}
}
async function renderUserPageSubmit(e){
  e.preventDefault();const f=new FormData(e.currentTarget);
  try{await addDoc(collection(db,"entries"),{userId:currentProfile.uid,userCode:currentProfile.userCode,userName:currentProfile.name,title:String(f.get("title")).trim(),category:String(f.get("category")),details:String(f.get("details")||"").trim(),createdAt:serverTimestamp()});e.currentTarget.reset();showToast("Entry submitted");}
  catch(err){showToast(safeError(err));}
}
function renderUser(){
  const own=entriesCache.filter(e=>e.userId===currentProfile.uid);
  setApp(`<div class="wrap">${header("Hello, "+esc(currentProfile.name.split(" ")[0]),"Submit a new entry. Your submission will appear on the admin dashboard in real time.")}<div class="grid"><div class="stat"><small>YOUR RECORDS</small><div class="num">${own.length}</div></div><div class="stat"><small>ACCOUNT STATUS</small><div class="num" style="font-size:22px;color:#16865f">${esc(currentProfile.status)}</div></div><div class="stat"><small>YOUR USER ID</small><div class="num" style="font-size:21px">${esc(currentProfile.userCode)}</div></div><div class="stat"><small>SYNC</small><div class="num" style="font-size:22px">Live</div></div></div><div class="two"><section class="panel"><h2>Create new entry</h2><p class="desc">Your records are securely linked to your account.</p><form id="entryForm"><div class="field"><label>ENTRY TITLE</label><input name="title" required maxlength="120" placeholder="What is this entry about?"></div><div class="field"><label>CATEGORY</label><select name="category"><option>General</option><option>Operations</option><option>Sales</option><option>Inventory</option><option>Attendance</option><option>Support</option><option>Other</option></select></div><div class="field"><label>DETAILS</label><textarea name="details" maxlength="3000" placeholder="Add relevant information…"></textarea></div><button class="btn primary">Submit entry</button></form></section><section class="panel"><h2>Submission guide</h2><p class="muted">Use a clear title, select the closest category, and include relevant details. Only you and workspace admins can access your entry records.</p></section></div><section class="panel"><h2>Your recent entries</h2><p class="desc">Only your own submissions are shown.</p>${entryTable(own)}</section></div>`);
  $("#entryForm").onsubmit=renderUserPageSubmit;
}
function exportCsv(){const rows=[["Record ID","User ID","User name","Title","Category","Details","Created"],...entriesCache.map(e=>[e.id,e.userCode,e.userName,e.title,e.category,e.details,dateText(e.createdAt)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="northstar-entries.csv";a.click();URL.revokeObjectURL(a.href);}
</script>
</body>
</html>
